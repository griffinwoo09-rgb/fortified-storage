plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = 'fortified-storage' }

loom {
	accessWidenerPath = file("src/main/resources/fortified_storage.classtweaker")
	splitEnvironmentSourceSets()
	mods {
		"fortified_storage" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
	configureTests {
		createSourceSet = true
		modId = "fortified_storage_test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Compatibility testing: -PcompatMods=/path/to/folder loads every mod jar in that folder into dev and test runs.
if (project.hasProperty('compatMods')) {
	loom.runs.configureEach { vmArg "-Dfabric.addMods=${project.property('compatMods')}" }
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
